name: Render Remotion Video

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Ensure Chrome Headless Shell
        run: npx remotion browser ensure

      - name: Render Full MP4 Video
        run: npx remotion render MainVideo out/MainVideo.mp4 --concurrency=4

      - name: Upload Rendered Video
        uses: actions/upload-artifact@v4
        with:
          name: MainVideo-mp4
          path: out/MainVideo.mp4
